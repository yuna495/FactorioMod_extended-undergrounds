[mod-name]
extended-undergrounds=Extended Undergrounds

[mod-description]
extended-undergrounds=Extends existing underground belt and pipe-to-ground distances by configurable startup multipliers without adding or duplicating prototypes.

[mod-setting-name]
extended-undergrounds-belt-distance-multiplier=Underground belt distance multiplier
extended-undergrounds-pipe-distance-multiplier=Underground pipe distance multiplier

[mod-setting-description]
extended-undergrounds-belt-distance-multiplier=Multiplies each existing underground belt prototype's max_distance during data-final-fixes. The result is floor(original distance x multiplier), clamped to 1..255.
extended-undergrounds-pipe-distance-multiplier=Multiplies every max_underground_distance found in pipe-to-ground prototype pipe connections during data-final-fixes. The result is floor(original distance x multiplier), clamped to 1..255.
