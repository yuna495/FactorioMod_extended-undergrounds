[mod-name]
extended-undergrounds=Extended Undergrounds

[mod-description]
extended-undergrounds=Extends existing underground belt and pipe-to-ground distances by configurable startup multipliers, with optional deep underground variants that do not connect to the normal underground layer.

[mod-setting-name]
extended-undergrounds-belt-distance-multiplier=Underground belt distance multiplier
extended-undergrounds-pipe-distance-multiplier=Underground pipe distance multiplier
extended-undergrounds-add-deep-underground-belts=Add deep underground belts
extended-undergrounds-add-deep-pipe-to-ground=Add deep underground pipes

[mod-setting-description]
extended-undergrounds-belt-distance-multiplier=Multiplies each existing underground belt prototype's max_distance during data-final-fixes. The result is floor(original distance x multiplier), clamped to 1..255.
extended-undergrounds-pipe-distance-multiplier=Multiplies every max_underground_distance found in pipe-to-ground prototype pipe connections during data-final-fixes. The result is floor(original distance x multiplier), clamped to 1..255.
extended-undergrounds-add-deep-underground-belts=When enabled, creates a darker deep copy of each compatible underground belt after distance multipliers are applied.
extended-undergrounds-add-deep-pipe-to-ground=When enabled, creates a darker deep copy of each compatible pipe to ground after distance multipliers are applied.

[extended-undergrounds]
deep-name=Deep __1__
deep-entity-description=Uses a separate underground layer from the normal version.
deep-item-description=Places the deep version, which does not connect underground to the normal version.
deep-recipe-description=Crafts the deep version from the corresponding normal item and its usual recipe materials.

