[mod-name]
extended-undergrounds=Extended Undergrounds

[mod-description]
extended-undergrounds=既存の地下ベルトと地下パイプの接続距離をスタートアップ設定の倍率で延長し、通常の地下経路とは接続しない深層版を任意で追加します。

[mod-setting-name]
extended-undergrounds-belt-distance-multiplier=地下ベルト距離倍率
extended-undergrounds-pipe-distance-multiplier=地下パイプ距離倍率
extended-undergrounds-add-deep-underground-belts=深層地下ベルトを追加する
extended-undergrounds-add-deep-pipe-to-ground=深層地下パイプを追加する

[mod-setting-description]
extended-undergrounds-belt-distance-multiplier=data-final-fixesで既存の地下ベルトprototypeのmax_distanceに倍率を掛けます。結果はfloor(元の距離 x 倍率)で計算し、1..255に制限します。
extended-undergrounds-pipe-distance-multiplier=data-final-fixesで地下パイプprototypeのpipe connectionにあるmax_underground_distanceすべてに倍率を掛けます。結果はfloor(元の距離 x 倍率)で計算し、1..255に制限します。
extended-undergrounds-add-deep-underground-belts=有効な場合、距離倍率を適用した後、対応する地下ベルトの暗い深層版を作成します。
extended-undergrounds-add-deep-pipe-to-ground=有効な場合、距離倍率を適用した後、対応する地下パイプの暗い深層版を作成します。

[extended-undergrounds]
deep-name=深層__1__
deep-entity-description=通常版とは別の地下経路を使用します。
deep-item-description=通常版とは地下で接続しない深層版を設置します。
deep-recipe-description=対応する通常品と通常レシピの材料から深層版を作成します。

[entity-name]
extended-undergrounds-deep-underground-belt=深層地下ベルト
extended-undergrounds-deep-fast-underground-belt=深層高速地下ベルト
extended-undergrounds-deep-express-underground-belt=深層超高速地下ベルト
extended-undergrounds-deep-turbo-underground-belt=深層ターボ地下ベルト
extended-undergrounds-deep-pipe-to-ground=深層地下パイプ

