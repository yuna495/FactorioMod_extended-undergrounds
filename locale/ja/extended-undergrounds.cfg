[mod-name]
extended-undergrounds=Extended Undergrounds

[mod-description]
extended-undergrounds=既存の地下ベルトと地下パイプの接続距離を、prototypeを追加・複製せず、スタートアップ設定の倍率で延長します。

[mod-setting-name]
extended-undergrounds-belt-distance-multiplier=地下ベルト距離倍率
extended-undergrounds-pipe-distance-multiplier=地下パイプ距離倍率

[mod-setting-description]
extended-undergrounds-belt-distance-multiplier=data-final-fixesで既存の地下ベルトprototypeのmax_distanceに倍率を掛けます。結果はfloor(元の距離 x 倍率)で計算し、1..255に制限します。
extended-undergrounds-pipe-distance-multiplier=data-final-fixesで地下パイプprototypeのpipe connectionにあるmax_underground_distanceすべてに倍率を掛けます。結果はfloor(元の距離 x 倍率)で計算し、1..255に制限します。
